[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.1.0"
description = "Foundation scaffold for the Synapse local hybrid memory system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Synapse" },
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "tomli>=2.0; python_version < '3.11'",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
synapse = "synapse.cli:main"

[tool.setuptools.packages.find]
include = ["synapse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: requires real internal LLM endpoint (skipped by default; run with: pytest -m live)",
]
